<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&family=Tajawal:wght@500;700&display=block" rel="stylesheet">
<style>
:root{--teal:#1E4D4A;--sand:#F6EFE4;--gold:#B98A4B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:Tajawal,sans-serif}
.s{position:relative;width:1080px;height:1920px;overflow:hidden;padding:260px 100px;text-align:center}
.teal{background:var(--teal);color:var(--sand)}
.sand{background:var(--sand);color:var(--teal)}
.k{font-size:40px;font-weight:700;color:var(--gold)}
.big{font-family:"Aref Ruqaa";font-weight:700;font-size:120px;line-height:1.35;margin-top:60px}
.txt{font-family:Amiri;font-size:62px;line-height:1.7;margin-top:50px}
.gold{color:var(--gold)}
.slot{margin:90px auto 0;width:760px;height:420px;}
.sig{position:absolute;bottom:200px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;font-family:"Aref Ruqaa";font-weight:700;font-size:52px}
.sig svg{width:76px;height:76px}
.mark{width:260px;height:260px;margin:0 auto}
.bigmark{position:absolute;left:-160px;bottom:-120px;width:760px;height:760px;opacity:.07}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <mask id="cm"><rect x="-10" y="-10" width="220" height="220" fill="#fff"/><circle cx="100" cy="72" r="74" fill="#000"/></mask>
    <symbol id="mk" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="82" mask="url(#cm)" fill="currentColor"/>
      <path fill="#B98A4B" transform="translate(100 108) scale(.72) translate(-100 -135)" d="M100 100 l7.6 13.6 15.3 -2.6 -2.6 15.3 13.6 7.6 -13.6 7.6 2.6 15.3 -15.3 -2.6 -7.6 13.6 -7.6 -13.6 -15.3 2.6 2.6 -15.3 -13.6 -7.6 13.6 -7.6 -2.6 -15.3 15.3 2.6z"/>
    </symbol>
  </defs>
</svg>

<!-- 1: welcome -->
<div class="s teal" data-file="story1-1">
  <svg class="bigmark" style="color:#F6EFE4"><use href="#mk"/></svg>
  <svg class="mark" style="color:#F6EFE4;margin-top:120px"><use href="#mk"/></svg>
  <div class="big" style="font-size:110px">أهلاً بكِ في<br><span class="gold">أُمٌّ وأُمَّة</span></div>
  <div class="txt">مساحةٌ لأمٍّ تتعلّم…<br>من القرآن، والسنّة، وكتب التربية،<br>ومن ثلاثةِ قلوبٍ صغيرة 🤍</div>
  <div class="k" style="margin-top:90px">أول ٣ منشورات على الحساب الآن ↓</div>
</div>

<!-- 2: poll -->
<div class="s sand" data-file="story1-2">
  <div class="k">سؤال سريع 🤍</div>
  <div class="big" style="font-size:112px">هل يغار أطفالُكِ<br><span class="gold">من بعضهم؟</span></div>
  <div class="slot"></div>
  <div class="sig"><svg style="color:#1E4D4A"><use href="#mk"/></svg>أُمٌّ وأُمَّة</div>
</div>

<!-- 3: question box -->
<div class="s teal" data-file="story1-3">
  <svg class="bigmark" style="color:#F6EFE4"><use href="#mk"/></svg>
  <div class="k">شاركيني تجربتك</div>
  <div class="big" style="font-size:104px">كيف تتعاملين مع<br><span class="gold">غيرة أطفالكِ؟</span></div>
  <div class="slot"></div>
  <div class="txt" style="font-size:46px;color:#d9d2c6;margin-top:70px">سأجمع أجمل الأجوبة في منشورٍ قادم</div>
  <div class="sig"><svg style="color:#F6EFE4"><use href="#mk"/></svg>أُمٌّ وأُمَّة</div>
</div>
</body>
</html>

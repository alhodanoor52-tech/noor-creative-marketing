<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0}
.c{width:1080px;height:1080px;background:radial-gradient(80% 80% at 50% 40%,#25605C 0%,#1E4D4A 60%,#173D3B 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F6EFE4}
.mark{width:320px;height:320px;margin-top:-60px}
.name{font-family:"Aref Ruqaa";font-weight:700;font-size:210px;line-height:1.1;margin-top:40px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <mask id="cm"><rect x="-10" y="-10" width="220" height="220" fill="#fff"/><circle cx="100" cy="72" r="74" fill="#000"/></mask>
    <symbol id="mk" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="82" mask="url(#cm)" fill="currentColor"/>
      <path fill="#B98A4B" transform="translate(100 108) scale(.72) translate(-100 -135)" d="M100 100 l7.6 13.6 15.3 -2.6 -2.6 15.3 13.6 7.6 -13.6 7.6 2.6 15.3 -15.3 -2.6 -7.6 13.6 -7.6 -13.6 -15.3 2.6 2.6 -15.3 -13.6 -7.6 13.6 -7.6 -2.6 -15.3 15.3 2.6z"/>
    </symbol>
  </defs>
</svg>
<div class="c" id="cover">
  <svg class="mark"><use href="#mk"/></svg>
  <div class="name">أُمٌّ وأُمَّة</div>
</div>
</body>
</html>

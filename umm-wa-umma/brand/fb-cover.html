<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&family=Tajawal:wght@500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.c{position:relative;width:1640px;height:624px;overflow:hidden;background:radial-gradient(90% 120% at 50% 40%,#25605C 0%,#1E4D4A 55%,#173D3B 100%);color:#F6EFE4;text-align:center;font-family:Tajawal,sans-serif}
.deco{position:absolute;width:520px;height:520px;opacity:.07}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:900px}
.mid{width:1200px}
.mark{width:96px;height:96px;display:block;margin:0 auto}
.name{font-family:"Aref Ruqaa";font-weight:700;font-size:110px;line-height:1.2;margin-top:18px}
.tag{font-family:Amiri;font-weight:700;font-size:56px;color:#D4A964;margin-top:4px}
.line{width:180px;height:3px;background:#D4A964;opacity:.7;margin:20px auto}
.pills{font-size:34px;font-weight:700;color:#F6EFE4}
.pills span{color:#D4A964;margin:0 12px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <mask id="cm"><rect x="-10" y="-10" width="220" height="220" fill="#fff"/><circle cx="100" cy="72" r="74" fill="#000"/></mask>
    <symbol id="mk" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="82" mask="url(#cm)" fill="currentColor"/>
      <path fill="#B98A4B" transform="translate(100 108) scale(.72) translate(-100 -135)" d="M100 100 l7.6 13.6 15.3 -2.6 -2.6 15.3 13.6 7.6 -13.6 7.6 2.6 15.3 -15.3 -2.6 -7.6 13.6 -7.6 -13.6 -15.3 2.6 2.6 -15.3 -13.6 -7.6 13.6 -7.6 -2.6 -15.3 15.3 2.6z"/>
    </symbol>
  </defs>
</svg>
<div class="c" id="cover">
  <svg class="deco" style="left:-150px;bottom:-200px;color:#F6EFE4"><use href="#mk"/></svg>
  <svg class="deco" style="right:-150px;top:-230px;color:#F6EFE4;transform:rotate(180deg)"><use href="#mk"/></svg>
  <div class="mid">
    <svg class="mark" style="color:#F6EFE4"><use href="#mk"/></svg>
    <div class="name">أُمٌّ وأُمَّة</div>
    <div class="tag">أمٌّ يعتزُّ الإسلامُ بأبنائها</div>
    <div class="line"></div>
    <div class="pills">تربية بهدي النبوة<span>✦</span>أفكار من كتب التربية<span>✦</span>تجارب حقيقية من البيت</div>
  </div>
</div>
</body>
</html>
